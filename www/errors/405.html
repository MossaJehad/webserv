<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>405 Method Not Allowed — webserv</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }
        .status-badge {
            display: inline-block;
            font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: #f87171;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #f87171;
            margin-bottom: 8px;
            font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace;
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-return {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0284c7;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .btn-return:hover {
            background: #0369a1;
        }
        .btn-return:active {
            transform: translateY(1px);
        }
        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="status-badge">HTTP ERROR 405</span>
        <h1>405</h1>
        <h2>Method Not Allowed</h2>
        <p>The HTTP method in the request is known by the server but not supported or restricted for this specific target location block.</p>
        <a href="/" class="btn-return">Return to Dashboard</a>
        <div class="footer-note">webserv &bull; C++98 Non-blocking HTTP/1.1 Server</div>
    </div>
</body>
</html>
