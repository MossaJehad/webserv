# Two websites sharing one interface:port, told apart by the Host header.
#
#   curl -H 'Host: site1.local' http://127.0.0.1:8080/
#   curl -H 'Host: site2.local' http://127.0.0.1:8080/
#
# The first server block is also the default for this endpoint, so an unknown
# Host still gets a valid response instead of an error.

server {
    listen 127.0.0.1:8080;
    server_name site1.local;
    client_max_body_size 1M;

    root www/vhost1;
    index index.html;

    location / {
        root www/vhost1;
        index index.html;
        methods GET;
        autoindex on;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name site2.local;
    client_max_body_size 1M;

    root www/vhost2;
    index index.html;

    location / {
        root www/vhost2;
        index index.html;
        methods GET;
        autoindex on;
    }
}
