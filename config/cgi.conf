# CGI-only server: every request is dispatched to an interpreter chosen by the
# script's file extension.
#
#   curl http://127.0.0.1:8080/hello.py
#   curl http://127.0.0.1:8080/hello.sh
#   curl http://127.0.0.1:8080/hello.pl
#   curl http://127.0.0.1:8080/hello.php
#   curl http://127.0.0.1:8080/relative.py   # proves the script's cwd
#   curl http://127.0.0.1:8080/broken.py     # failing script -> 502
#   curl http://127.0.0.1:8080/timeout.py    # infinite loop  -> 504

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;

    root www/cgi-bin;
    index hello.py;

    location / {
        root www/cgi-bin;
        methods GET POST;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
        cgi_ext .pl /usr/bin/perl;
        cgi_ext .php /usr/bin/php-cgi;
        autoindex on;
    }
}
