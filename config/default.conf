server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    root www/site;
    index index.html;

    location / {
        root www/site;
        index index.html;
        methods GET POST DELETE;
        autoindex on;
    }

    location /uploads {
        root www/uploads;
        methods GET POST DELETE;
        upload_dir www/uploads;
        autoindex on;
    }

    location /cgi-bin {
        root www/cgi-bin;
        methods GET POST;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
        cgi_ext .php /usr/bin/php-cgi;
    }

    location /redirect {
        return 301 /;
    }

    location /google {
        return 302 https://www.google.com;
    }

    location /restricted {
        root www/site;
        methods GET;
    }
}
