server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 504 /errors/504.html;

    root www/site;
    index index.html;

    # Root route: serves the static site and accepts a small POST body so the
    # client_max_body_size limit can be demonstrated with a plain curl -X POST.
    location / {
        root www/site;
        index index.html;
        methods GET POST;
        upload_dir www/uploads;
        client_max_body_size 1k;
        autoindex on;
    }

    # A different directory with its own default file, reached under /alt.
    location /alt {
        root www/alt;
        index home.html;
        methods GET;
        autoindex off;
    }

    location /uploads {
        root www/uploads;
        methods GET POST DELETE;
        upload_dir www/uploads;
        autoindex on;
    }

    location /cgi-bin {
        root www/cgi-bin;
        methods GET POST;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
        cgi_ext .pl /usr/bin/perl;
        cgi_ext .php /usr/bin/php-cgi;
    }

    location /redirect {
        return 301 /;
    }

    location /google {
        return 302 https://www.google.com;
    }

    # GET-only route, used to demonstrate 405 Method Not Allowed.
    location /restricted {
        root www/site;
        methods GET;
    }

    # POST is accepted here but no upload_dir is configured, so a POST has
    # nowhere legitimate to store anything and must be refused.
    location /noupload {
        root www/site;
        methods GET POST;
    }
}
