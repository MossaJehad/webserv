server {
    listen 127.0.0.1:8081;
    server_name localhost;
    client_max_body_size 10M;

    root www/cgi-bin;

    location /cgi-bin {
        root www/cgi-bin;
        methods GET POST;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
        cgi_ext .pl /usr/bin/perl;
        cgi_ext .php /usr/bin/php-cgi;
    }
}
