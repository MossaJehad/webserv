server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    root www/site;
    index index.html;

    location / {
        root www/site;
        index index.html;
        methods GET POST;
    }
}
